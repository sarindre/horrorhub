<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HorrorHub</title>
    <script>
      // Apply the saved theme before first paint so there's no light flash.
      // Keep in sync with useTheme() and the settings key in src/lib/settings.js.
      (function () {
        var dark = true;
        try {
          var stored = JSON.parse(localStorage.getItem("horrorhub.settings.v2") || "null");
          var theme = (stored && stored.settings && stored.settings.theme) || "dark";
          dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
