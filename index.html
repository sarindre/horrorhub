<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AA%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HorrorHub</title>
    <script>
      // Apply the saved theme before first paint so there's no light flash.
      // Keep in sync with useTheme() and the settings key in src/lib/settings.js.
      (function () {
        var dark = true;
        try {
          var stored = JSON.parse(localStorage.getItem("horrorhub.settings.v2") || "null");
          var theme = (stored && stored.settings && stored.settings.theme) || "dark";
          dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
